<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5">
<title>VO₂max vs Body Mass — Cross-Species Comparison</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; font-family: sans-serif; }
  .chart-container { position: relative; width: 100%; height: 540px; padding: 0.5rem 0; }
</style>
</head>
<body>
<div class="chart-container">
  <canvas id="c" role="img" aria-label="Log-log scatter plot of VO2max vs body mass across species by locomotion type"></canvas>
</div>
<script>
const species = [
  { common:"Bumblebee",               sci:"Bombus terrestris",       mass_kg:2e-4,   vo2:1250, loco:"hover"   },
  { common:"Dragonfly",               sci:"Anax junius",             mass_kg:1e-3,   vo2:800,  loco:"hover"   },
  { common:"Hummingbird",             sci:"Selasphorus spp.",        mass_kg:4e-3,   vo2:750,  loco:"hover"   },
  { common:"Pallas' nectar bat",      sci:"Glossophaga soricina",    mass_kg:0.012,  vo2:450,  loco:"hover"   },
  { common:"Pygmy mouse",             sci:"Baiomys taylori",         mass_kg:0.0072, vo2:262,  loco:"run"     },
  { common:"Greater spear-nosed bat", sci:"Phyllostomus hastatus",   mass_kg:0.093,  vo2:390,  loco:"forward" },
  { common:"Flying fox",              sci:"Pteropus gouldii",        mass_kg:0.74,   vo2:188,  loco:"forward" },
  { common:"Skipjack tuna",           sci:"Katsuwonus pelamis",      mass_kg:2,      vo2:42,   loco:"swim"    },
  { common:"Sockeye salmon",          sci:"Oncorhynchus nerka",      mass_kg:3,      vo2:8.5,  loco:"swim"    },
  { common:"Sled dog",                sci:"Canis l. familiaris",     mass_kg:25,     vo2:198,  loco:"run"     },
  { common:"Pronghorn",               sci:"Antilocapra americana",   mass_kg:32,     vo2:300,  loco:"run"     },
  { common:"Racehorse",               sci:"Equus caballus",          mass_kg:490,    vo2:152,  loco:"run"     },
  { common:"Human",                   sci:"Homo sapiens",            mass_kg:70,     vo2:97,   loco:"skiski"  },
  { common:"Human",                   sci:"Homo sapiens",            mass_kg:70,     vo2:85,   loco:"run"     },
  { common:"Human",                   sci:"Homo sapiens",            mass_kg:70,     vo2:80,   loco:"swim"    },
  { common:"Bottlenose dolphin",      sci:"Tursiops truncatus",      mass_kg:175,    vo2:25,   loco:"swim"    },
  { common:"Killer whale",            sci:"Orcinus orca",            mass_kg:4000,   vo2:25,   loco:"swim"    },
];

const colors  = { hover:"#378ADD", forward:"#378ADD", run:"#3B6D11", swim:"#BA7517", skiski:"#3B6D11" };
const shapeMap = { hover:"circle", forward:"triangle", run:"rect", swim:"cross", skiski:"diamond" };

const canvas = document.getElementById("c");
canvas.style.width = "100%";
canvas.style.height = "540px";

const isDark = matchMedia("(prefers-color-scheme:dark)").matches;
const tc = isDark ? "rgba(255,255,255,0.7)" : "rgba(0,0,0,0.6)";
const gc = isDark ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.06)";

const massLabels = {
  "-4":"0.1 g", "-3":"1 g",  "-2":"10 g",  "-1":"100 g",
   "0":"1 kg",   "1":"10 kg", "2":"100 kg", "3":"1000 kg", "4":"10,000 kg"
};
const yTicks = [5,10,20,50,100,200,500,1000,1500].map(v=>({val:Math.log10(v),label:String(v)}));

function drawCustomPoint(ctx, shape, x, y, r, fillColor, strokeColor) {
  ctx.save();
  ctx.fillStyle=fillColor; ctx.strokeStyle=strokeColor; ctx.lineWidth=1.5;
  if (shape==="circle")    { ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.stroke(); }
  else if (shape==="triangle") { ctx.beginPath(); ctx.moveTo(x,y-r); ctx.lineTo(x+r*0.87,y+r*0.5); ctx.lineTo(x-r*0.87,y+r*0.5); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (shape==="rect")     { ctx.fillRect(x-r*0.85,y-r*0.85,r*1.7,r*1.7); ctx.strokeRect(x-r*0.85,y-r*0.85,r*1.7,r*1.7); }
  else if (shape==="diamond")  { ctx.beginPath(); ctx.moveTo(x,y-r*1.1); ctx.lineTo(x+r*0.85,y); ctx.lineTo(x,y+r*1.1); ctx.lineTo(x-r*0.85,y); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  else if (shape==="cross") {
    const t=r*0.35, a=r*0.95;
    ctx.beginPath();
    ctx.moveTo(x-t,y-a); ctx.lineTo(x+t,y-a); ctx.lineTo(x+t,y-t);
    ctx.lineTo(x+a,y-t); ctx.lineTo(x+a,y+t); ctx.lineTo(x+t,y+t);
    ctx.lineTo(x+t,y+a); ctx.lineTo(x-t,y+a); ctx.lineTo(x-t,y+t);
    ctx.lineTo(x-a,y+t); ctx.lineTo(x-a,y-t); ctx.lineTo(x-t,y-t);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function makeDataset(key) {
  return {
    data: species.filter(s=>s.loco===key).map(s=>({
      x: Math.log10(s.mass_kg), y: Math.log10(s.vo2),
      label: s.common, sci: s.sci, rawVo2: s.vo2, rawMass: s.mass_kg, loco: key
    })),
    backgroundColor: colors[key]+"cc", borderColor: colors[key],
    borderWidth: 1.5, pointStyle: "circle", pointRadius: 0,
  };
}

// Per-species label placement: dx/dy offset in px, align = "left" (label to right of dot) or "right" (label to left)
const labelOffsets = {
  "Bumblebee":               { dx:12,  dy:-4,  align:"left"  },
  "Dragonfly":               { dx:-12, dy:4,   align:"right" },
  "Hummingbird":             { dx:12,  dy:-4,  align:"left"  },
  "Pallas' nectar bat":      { dx:-12, dy:-4,  align:"right" },
  "Pygmy mouse":             { dx:12,  dy:4,   align:"left"  },
  "Greater spear-nosed bat": { dx:12,  dy:-18, align:"left"  },
  "Flying fox":              { dx:-12, dy:4,   align:"right" },
  "Skipjack tuna":           { dx:-12, dy:4,   align:"right" },
  "Sockeye salmon":          { dx:-12, dy:4,   align:"right" },
  "Sled dog":                { dx:-12, dy:4,   align:"right" },
  "Pronghorn":               { dx:-12, dy:-4,  align:"right" },
  "Racehorse":               { dx:-12, dy:-4,  align:"right" },
  "Human_97":                null,   // suppressed — too close to Human_85
  "Human_85":                { dx:-12, dy:-4,  align:"right" },
  "Human_80":                null,   // suppressed — too close to Human_85
  "Bottlenose dolphin":      { dx:-12, dy:-4,  align:"right" },
  "Killer whale":            { dx:-12, dy:-4,  align:"right" },
};

let tooltipData = null;

new Chart(canvas, {
  type: "scatter",
  data: { datasets: ["hover","forward","run","swim","skiski"].map(makeDataset) },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top:16, right:170, bottom:8, left:8 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        enabled: false,
        external(context) {
          const { chart, tooltip } = context;
          if (tooltip.opacity === 0) { tooltipData = null; chart.draw(); return; }
          const pt = tooltip.dataPoints?.[0];
          if (!pt) return;
          tooltipData = {
            x: tooltip.caretX, y: tooltip.caretY,
            label: pt.raw.label, sci: pt.raw.sci,
            mass: pt.raw.rawMass, vo2: pt.raw.rawVo2,
          };
          chart.draw();
        }
      }
    },
    scales: {
      x: {
        title: { display:true, text:"Body mass (log scale)", color:tc, font:{size:12} },
        min: -4, max: 4.0,
        grid: { color: gc },
        ticks: { color:tc, font:{size:11}, callback: v => massLabels[String(Math.round(v))] || "" }
      },
      y: {
        title: { display:true, text:"VO₂max — ml O₂/kg/min (log scale)", color:tc, font:{size:12} },
        min: 0.7, max: 3.3,
        grid: { display: false },
        ticks: {
          color: tc, font: { size:11 },
          values: yTicks.map(t=>t.val),
          callback: v => { const m = yTicks.find(t => Math.abs(t.val-v) < 0.001); return m ? m.label : ""; }
        }
      }
    }
  },
  plugins: [
    {
      id: "customPoints",
      afterDatasetsDraw(chart) {
        const ctx = chart.ctx;
        chart.data.datasets.forEach((ds, di) => {
          ds.data.forEach((pt, pi) => {
            const el = chart.getDatasetMeta(di).data[pi];
            if (!el) return;
            drawCustomPoint(ctx, shapeMap[pt.loco], el.x, el.y, 8, colors[pt.loco]+"cc", colors[pt.loco]);
          });
        });
      }
    },
    {
      id: "yGridlines",
      beforeDatasetsDraw(chart) {
        const ctx = chart.ctx;
        const { left, right, top, bottom } = chart.chartArea;
        const yScale = chart.scales.y;
        ctx.save();
        ctx.lineWidth = 0.5;
        yTicks.forEach(t => {
          const y = yScale.getPixelForValue(t.val);
          if (y < top || y > bottom) return;
          const isMajor = [10, 100, 1000].includes(Number(t.label));
          ctx.strokeStyle = isDark
            ? (isMajor ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.06)")
            : (isMajor ? "rgba(0,0,0,0.10)"       : "rgba(0,0,0,0.05)");
          ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
        });
        ctx.restore();
      }
    },
    {
      id: "labels",
      afterDraw(chart) {
        const ctx = chart.ctx;
        const isDk = matchMedia("(prefers-color-scheme:dark)").matches;
        chart.data.datasets.forEach((ds, di) => {
          ds.data.forEach((pt, pi) => {
            const el = chart.getDatasetMeta(di).data[pi];
            if (!el) return;
            const key = pt.label === "Human" ? `Human_${pt.rawVo2}` : pt.label;
            const cfg = labelOffsets[key];
            if (cfg === null || !cfg) return;
            ctx.save();
            ctx.textAlign = cfg.align === "left" ? "left" : "right";
            ctx.fillStyle = isDk ? "rgba(235,235,235,0.92)" : "rgba(20,20,20,0.88)";
            ctx.font = "bold 11px sans-serif";
            ctx.fillText(pt.label, el.x + cfg.dx, el.y + cfg.dy);
            ctx.fillStyle = isDk ? "rgba(200,200,200,0.65)" : "rgba(80,80,80,0.78)";
            ctx.font = "italic 9.5px sans-serif";
            ctx.fillText(pt.sci, el.x + cfg.dx, el.y + cfg.dy + 12);
            ctx.restore();
          });
        });
      }
    },
    {
      id: "customTooltip",
      afterDraw(chart) {
        if (!tooltipData) return;
        const ctx = chart.ctx;
        const { x, y, label, sci, mass, vo2 } = tooltipData;
        const kg = mass;
        const mstr = kg < 0.001 ? (kg*1e6).toFixed(0)+" mg"
                   : kg < 1    ? (kg*1000).toFixed(1)+" g"
                   : kg >= 1000 ? (kg/1000).toFixed(1)+" t"
                   : kg+" kg";
        const lines = [label, sci, `Mass: ${mstr}`, `VO₂max: ${vo2} ml/kg/min`];
        ctx.save();
        ctx.font = "bold 13px sans-serif";
        const titleW = ctx.measureText(label).width;
        ctx.font = "12px sans-serif";
        const maxW = Math.max(titleW, ...lines.slice(1).map(l => ctx.measureText(l).width));
        const pad = 10, lineH = 18;
        const boxW = maxW + pad*2, boxH = lines.length * lineH + pad*2;
        const cw = chart.width, ch = chart.height;
        let bx = x + 12, by = y - boxH/2;
        if (bx + boxW > cw - 10) bx = x - boxW - 12;
        if (by < 5) by = 5;
        if (by + boxH > ch - 5) by = ch - boxH - 5;
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#111111";
        ctx.strokeStyle = "#444444";
        ctx.lineWidth = 1;
        const r = 4;
        ctx.beginPath();
        ctx.moveTo(bx+r, by); ctx.lineTo(bx+boxW-r, by); ctx.arcTo(bx+boxW, by, bx+boxW, by+r, r);
        ctx.lineTo(bx+boxW, by+boxH-r); ctx.arcTo(bx+boxW, by+boxH, bx+boxW-r, by+boxH, r);
        ctx.lineTo(bx+r, by+boxH); ctx.arcTo(bx, by+boxH, bx, by+boxH-r, r);
        ctx.lineTo(bx, by+r); ctx.arcTo(bx, by, bx+r, by, r);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        let ty = by + pad + lineH*0.75;
        lines.forEach((line, i) => {
          ctx.fillStyle = i===0 ? "#ffffff" : (i===1 ? "#aaaaaa" : "#dddddd");
          ctx.font = i===0 ? "bold 13px sans-serif" : (i===1 ? "italic 11px sans-serif" : "12px sans-serif");
          ctx.textAlign = "left";
          ctx.fillText(line, bx + pad, ty);
          ty += lineH;
        });
        ctx.restore();
      }
    },
    {
      id: "legend",
      afterDraw(chart) {
        const ctx = chart.ctx;
        const { right, top } = chart.chartArea;
        const lx = right + 18;
        let ly = top + 10;
        const isDk = matchMedia("(prefers-color-scheme:dark)").matches;
        const tc2 = isDk ? "rgba(220,220,220,0.9)" : "rgba(40,40,40,0.85)";
        const tc3 = isDk ? "rgba(180,180,180,0.8)" : "rgba(80,80,80,0.8)";
        ctx.save();
        ctx.fillStyle = tc2;
        ctx.font = "bold 12px sans-serif";
        ctx.fillText("Type of locomotion", lx, ly); ly += 22;
        const items = [
          { label:"Flying (hovering)", color:"#378ADD", shape:"circle"   },
          { label:"Flying (forward)",  color:"#378ADD", shape:"triangle" },
          { label:"Running",           color:"#3B6D11", shape:"rect"     },
          { label:"Skiing / cycling",  color:"#3B6D11", shape:"diamond"  },
          { label:"Swimming",          color:"#BA7517", shape:"cross"    },
        ];
        items.forEach(item => {
          drawCustomPoint(ctx, item.shape, lx+7, ly, 6, item.color+"cc", item.color);
          ctx.fillStyle = tc3;
          ctx.font = "12px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(item.label, lx+18, ly+4);
          ly += 24;
        });
        ctx.restore();
      }
    }
  ]
});
</script>
</body>
</html>
